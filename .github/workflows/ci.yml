name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: tri, POSTGRES_PASSWORD: tri, POSTGRES_DB: tri }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv venv && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Migrations apply cleanly on Postgres
        run: .venv/bin/alembic upgrade head
        env: { DATABASE_URL: "postgresql://tri:tri@localhost:5432/tri" }
      - run: .venv/bin/pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint src
      - run: npx prettier --check src
      - run: npx vitest run
      - run: npx vite build --outDir dist

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tri-dash .
